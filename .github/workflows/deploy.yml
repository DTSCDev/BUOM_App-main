name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build project
        run: npm run build
        
      - name: Check for required secrets
        run: |
          if [ -z "${{ secrets.VERCEL_DEPLOY_TOKEN }}" ]; then
            echo "❌ VERCEL_DEPLOY_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.ORG_ID }}" ]; then
            echo "❌ ORG_ID secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.PROJECT_ID }}" ]; then
            echo "❌ PROJECT_ID secret is not set"
            exit 1
          fi
          echo "✅ All required secrets are configured"
        
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
        
      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_DEPLOY_TOKEN }}
        
      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_DEPLOY_TOKEN }}
        
      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_DEPLOY_TOKEN }}